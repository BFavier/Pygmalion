[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygmalion"
dynamic = ["version"]
requires-python = ">= 3.12"
dependencies = [
    "pandas >= 1.0",
    "numpy >= 1.18",
    "torch >= 1.6",
    "requests >= 2.25",
    "unidecode >= 1.3.6",
    "tqdm >= 4.64.0",
]

[project.optional-dependencies]
all = [
    "matplotlib >= 3.2",
]

[tool.setuptools.packages.find]
include = [
  "pygmalion", "pygmalion.*",
]

[tool.setuptools.dynamic]
version = {attr = "pygmalion.__version__"}
